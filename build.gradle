plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"halloween" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Vivecraft API for VR play, compile only: the mod runs without it. Taken from the game instance,
	// not downloaded (see vivecraft_jar in gradle.properties).
	compileOnly files(project.vivecraft_jar)
	clientCompileOnly files(project.vivecraft_jar)
}

// Two builds from one tree: -Pedition=all (default, the full game with Michael, the Demogorgon and Vecna) or
// -Pedition=michael (a separate mod, id halloween_michael, with Michael as the only killer and none of the others' art
// and sound). Both keep the "halloween" resource namespace, so they can't be installed together (fabric.mod.json breaks).
def edition = project.findProperty("edition") ?: "all"
if (!(edition in ["all", "michael"])) {
	throw new GradleException("edition must be 'all' or 'michael', not '${edition}'")
}
def michaelOnly = edition == "michael"
base.archivesName = michaelOnly ? "halloween-michael" : "halloween"

processResources {
	def version = project.version
	inputs.property "version", version
	inputs.property "edition", edition

	def modId = michaelOnly ? "halloween_michael" : "halloween"
	def modName = michaelOnly ? "Halloween: Michael" : "Halloween"
	def modDescription = michaelOnly ? "Halloween: The Game (IllFonic) gameplay recreated in Minecraft, Michael Myers only. Private build."
		: "Halloween: The Game (IllFonic) gameplay recreated in Minecraft. Private build."
	def otherId = michaelOnly ? "halloween" : "halloween_michael"
	filesMatching("fabric.mod.json") {
		expand "version": version, "modId": modId, "modName": modName, "modDescription": modDescription, "otherId": otherId
	}

	if (michaelOnly) {
		// The Demogorgon's and Vecna's art and sound stay out of the Michael build.
		exclude "assets/halloween/sounds/vecna/**"
		exclude "assets/halloween/models/entity/vecna.json", "assets/halloween/models/entity/demogorgon.json", "assets/halloween/models/entity/rift.json"
		exclude "assets/halloween/textures/entity/vecna*", "assets/halloween/textures/entity/demogorgon.png", "assets/halloween/textures/entity/rift*"
		exclude "assets/halloween/textures/particle/vecna_*", "assets/halloween/particles/vecna_*"
		exclude "assets/halloween/items/vecna_*", "assets/halloween/items/rift*.json", "assets/halloween/models/item/rift.json", "assets/halloween/textures/item/rift.png"
		filesMatching("assets/halloween/sounds.json") {
			filter { line -> line.contains("halloween:vecna/") ? null : line }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


fabricApi {
	configureTests {
		createSourceSet = true
		modId = "halloween-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
