plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"halloween" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Halloween's atmosphere (fog, the screen's pass, shaders) is a mod of its own, halloween_atmos: a small jar
// (build/libs/halloween-atmos-*.jar) that can be changed and put in without the game's 180 MB of sounds.
sourceSets {
	atmos {
		compileClasspath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
		runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.main.output + sourceSets.client.output
	}
}

loom {
	mods {
		"halloween_atmos" {
			sourceSet sourceSets.atmos
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Vivecraft API for VR play, compile only: the mod runs without it. Taken from the game instance,
	// not downloaded (see vivecraft_jar in gradle.properties).
	compileOnly files(project.vivecraft_jar)
	clientCompileOnly files(project.vivecraft_jar)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}


fabricApi {
	configureTests {
		createSourceSet = true
		modId = "halloween-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Sodium in the test client too, with -Phw_sodium: the terrain then goes through its shaders, as in the game.
if (project.hasProperty("hw_sodium")) {
	dependencies {
		gametestRuntimeOnly files(project.sodium_jar)
	}
}

processAtmosResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

def atmosJar = tasks.register("atmosJar", Jar) {
	archiveBaseName = "halloween-atmos"
	from sourceSets.atmos.output
}

tasks.named("build") {
	dependsOn atmosJar
}

// The test client runs with the atmosphere too.
dependencies {
	gametestImplementation sourceSets.atmos.output
}
